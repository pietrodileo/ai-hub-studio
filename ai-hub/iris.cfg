# IRIS Configuration for AI Hub Studio
# This configuration file is used when starting IRIS with AI Hub support

[config]
# Enable AI Hub
AIHubEnabled=1

# AI Hub specific ports
AIHubPort=53773
AIHubWebSocketPort=53773

# Default namespace for AI Hub Studio
DefaultNamespace=AIHubStudio

# Security settings
SecurityEnabled=1

# Web server configuration
WebServerEnabled=1
WebServerPort=1972

# SuperServer configuration
SuperServerEnabled=1
SuperServerPort=52773

# Allow external connections
AllowExternalConnections=1

# Enable REST API
RESTEnabled=1

# Enable CSP Gateway
CSPGatewayEnabled=1

# Enable WebSocket support
WebSocketEnabled=1

# Memory and performance settings
MaxMemory=8192
MaxProcesses=100

# Journal settings
JournalEnabled=1
JournalDirectory=/durable/iris/journal

# Database settings
DatabaseDirectory=/durable/iris

# Temp directory
TempDirectory=/tmp/iris

# Global buffer settings
GlobalBuffers=1024
RoutineBuffers=512

# Lock table size
LockTableSize=8192

# Enable Unicode
Unicode=1

# Timezone
Timezone=UTC

# Enable error logging
ErrorLogEnabled=1
ErrorLogLevel=3

# AI Hub specific settings
[AIHub]
Enabled=1
Port=53773
WebSocketPort=53773
MaxAgents=50
MaxTools=100
MaxSkills=50

# Provider configurations
[AIHub.Providers]
# These will be configured through the AIHubStudio.Config class
# OpenAI, Azure, Anthropic, Google, Local/Ollama support

# Logging configuration
[Logging]
LogDirectory=/opt/irisapp/logs
LogLevel=INFO
MaxLogSize=100
MaxLogFiles=10