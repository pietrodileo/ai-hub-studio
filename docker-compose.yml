# ------------------------------------------------------------------------------
# IRIS AI Hub Studio - Docker Compose Configuration
# 
# This configuration sets up InterSystems IRIS with AI Hub EAP for the
# IRIS AI Hub Studio project (Bounty Program Round 2)
# 
# Services:
#   - IRIS with AI Hub: Primary database with AI capabilities
#   - Frontend: React frontend for AI Hub Studio web interface
# ------------------------------------------------------------------------------

services:
  iris:
    container_name: iris-ai-hub-studio
    build:
      context: .
      dockerfile: Dockerfile
    env_file: 
      .env
    image: iris-ai-hub-studio:latest
    pull_policy: build
    init: true
    restart: unless-stopped
    environment:
      # IRIS data directory
      #- ISC_DATA_DIRECTORY=/durable/iris
      # AI Hub configuration
      - AI_HUB_ENABLED=1
      - AI_HUB_PORT=53773
      - AI_HUB_WS_PORT=53773
      - WG_USER=${WG_USER:-}
      - WG_PASS=${WG_PASS:-}
      - APP_USER=${APP_USER:-}
      - APP_PASS=${APP_PASS:-}
    ports:
      # Management Portal / REST APIs (default 52773 -> 9092)
      - "9092:52773"
      # SuperServer port (default 1972 -> 9091)
      - "9091:1972"
      # AI Hub specific ports
      - "53773:53773"  # AI Hub WebSocket
      - "8080:8080"    # MCP HTTP transport
    networks:
      - iris-ai-network

  # Frontend service for AI Hub Studio
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - iris
    restart: unless-stopped
    networks:
      - iris-ai-network

networks:
  iris-ai-network:
    driver: bridge

# ------------------------------------------------------------------------------
# Usage Notes:
# ------------------------------------------------------------------------------
# 
# Basic usage (IRIS only):
#   docker compose up -d iris
#
# Full stack (IRIS + frontend):
#   docker compose up -d
#
# Access URLs:
#   - IRIS Management Portal: http://localhost:9092/csp/sys/UtilHome.csp
#   - AI Hub Studio: http://localhost:5173
#   - IRIS REST API: http://localhost:9092
#
# ------------------------------------------------------------------------------
